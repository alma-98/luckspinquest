openapi: 3.0.3

info:
  title: LuckSpinQuest Admin Quest API
  version: 1.0.0
  description: Admin Quest management API for LuckSpinQuest

servers:
  - url: http://localhost:8282
    description: Local Development

tags:
  - name: Admin Quest
    description: Administrative Quest management APIs

paths:

  /api/v1/admin/quests:
    get:
      tags:
        - Admin Quest
      summary: List quests
      description: List quests for administrative management.
      operationId: adminListQuests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quests retrieved successfully
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required

    post:
      tags:
        - Admin Quest
      summary: Create quest
      description: Create a new quest as an administrator.
      operationId: adminCreateQuest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestRequest'
      responses:
        '200':
          description: Quest created successfully
        '201':
          description: Quest created successfully
        '202':
          description: Quest creation accepted
        '400':
          description: Invalid quest data
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required

  /api/v1/admin/quests/{id}:
    get:
      tags:
        - Admin Quest
      summary: Get quest detail
      description: Get details of a specific quest.
      operationId: adminGetQuest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuestId'
      responses:
        '200':
          description: Quest detail retrieved successfully
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required
        '404':
          description: Quest not found

    put:
      tags:
        - Admin Quest
      summary: Update quest
      description: Update an existing quest as an administrator.
      operationId: adminUpdateQuest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestRequest'
      responses:
        '200':
          description: Quest updated successfully
        '204':
          description: Quest updated successfully with no response body
        '400':
          description: Invalid quest data
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required
        '404':
          description: Quest not found

    delete:
      tags:
        - Admin Quest
      summary: Delete quest
      description: Delete a specific quest.
      operationId: adminDeleteQuest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuestId'
      responses:
        '200':
          description: Quest deleted successfully
        '204':
          description: Quest deleted successfully with no response body
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required
        '404':
          description: Quest not found

  /api/v1/admin/quests/{id}/status:
    patch:
      tags:
        - Admin Quest
      summary: Change quest status
      description: Change the status of a specific quest.
      operationId: adminChangeQuestStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeQuestStatusRequest'
      responses:
        '200':
          description: Quest status changed successfully
        '204':
          description: Quest status changed successfully with no response body
        '400':
          description: Invalid quest status
        '401':
          description: Authentication required
        '403':
          description: ADMIN role required
        '404':
          description: Quest not found

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ADMIN JWT access token

  parameters:

    QuestId:
      name: id
      in: path
      required: true
      description: Quest ID
      schema:
        type: string
      example: "quest-001"

  schemas:

    QuestRequest:
      type: object
      description: Quest data.
      properties:
        name:
          type: string
          example: Daily Spin Quest
        description:
          type: string
          example: Complete three Lucky Spins today
        type:
          type: string
          example: DAILY
        status:
          type: string
          example: ACTIVE

    ChangeQuestStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ACTIVE
          enum:
            - ACTIVE
            - INACTIVE
            - DRAFT
            - ARCHIVED
