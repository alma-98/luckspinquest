openapi: 3.0.3

info:
  title: LuckSpinQuest Users API
  version: 1.0.0
  description: Users API for LuckSpinQuest

servers:
  - url: http://localhost:8282
    description: Local Development

tags:
  - name: Users
    description: Current authenticated user APIs

paths:

  /api/v1/users/me:
    get:
      tags:
        - Users
      summary: Get current user
      description: Get the currently authenticated user's information.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user retrieved successfully
        '401':
          description: Authentication required

    put:
      tags:
        - Users
      summary: Update current user
      description: Update the currently authenticated user's information.
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: User updated successfully
        '204':
          description: User updated successfully with no response body
        '400':
          description: Invalid request
        '401':
          description: Authentication required

    delete:
      tags:
        - Users
      summary: Delete current user
      description: Delete the currently authenticated user's account.
      operationId: deleteCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User deleted successfully
        '204':
          description: User deleted successfully with no response body
        '401':
          description: Authentication required

  /api/v1/users/me/activity:
    get:
      tags:
        - Users
      summary: Get user activity
      description: Get activity history for the currently authenticated user.
      operationId: getCurrentUserActivity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User activity retrieved successfully
        '401':
          description: Authentication required

  /api/v1/users/me/statistics:
    get:
      tags:
        - Users
      summary: Get user statistics
      description: Get statistics for the currently authenticated user.
      operationId: getCurrentUserStatistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User statistics retrieved successfully
        '401':
          description: Authentication required

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token

  schemas:

    UpdateCurrentUserRequest:
      type: object
      properties:
        username:
          type: string
          example: player001
        email:
          type: string
          format: email
          example: player001@example.com
        displayName:
          type: string
          example: Player One
