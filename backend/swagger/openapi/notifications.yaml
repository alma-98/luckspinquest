openapi: 3.0.3

info:
  title: LuckSpinQuest Notifications API
  version: 1.0.0
  description: |
    Notifications API for LuckSpinQuest.

servers:
  - url: http://localhost:8282
    description: Local Development

tags:
  - name: Notifications
    description: User notification management APIs

paths:

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: Get notifications for the authenticated user.
      operationId: listNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications retrieved successfully
        '401':
          description: Authentication required

  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      description: Mark a notification as read for the authenticated user.
      operationId: markNotificationAsRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Notification marked as read successfully
        '204':
          description: Notification marked as read successfully
        '401':
          description: Authentication required
        '404':
          description: Notification not found

  /api/v1/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all notifications as read
      description: Mark all notifications of the authenticated user as read.
      operationId: markAllNotificationsAsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read successfully
        '204':
          description: All notifications marked as read successfully
        '401':
          description: Authentication required

  /api/v1/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete notification
      description: Delete a notification belonging to the authenticated user.
      operationId: deleteNotification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Notification deleted successfully
        '204':
          description: Notification deleted successfully
        '401':
          description: Authentication required
        '404':
          description: Notification not found

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token
