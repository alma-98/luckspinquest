spring.application.name=luckspinquest


spring.datasource.url=jdbc:postgresql://localhost:5432/luckspinquest
spring.datasource.username=adminluckspinquest
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

server.port=8282

# ============================================================
# LuckSpinQuest Spring Boot Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ============================================================
# Flyway - existing LuckSpinQuest schema
# ============================================================
spring.flyway.baseline-on-migrate=true

# ============================================================
# JWT
# ============================================================
app.jwt.secret=LuckSpinQuest-Local-Dev-Secret-2026-AtLeast-32Chars
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
